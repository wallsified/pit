site_name: "Pit: Python Information Tracker"
site_author: "wallsified"
repo_url: https://github.com/wallsified/pit
repo_name: "wallsified/pit"
copyright: Copyright © 2025 wallsified

nav:
  - Home: index.md
  - About: about.md

theme:
  name: terminal
  palette: dark
  locale: es
  include_sidebar: true
  features:
